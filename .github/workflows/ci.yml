name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          # Generating the client reads the config but never connects.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      # Next 16 generates the PageProps and RouteContext types the code uses.
      - run: npx next typegen
      - run: npx tsc --noEmit
